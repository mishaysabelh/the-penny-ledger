        if(!name || isNaN(target)) return;
        if(editingGoalId){
          const g = goals.find(x=>x.id===editingGoalId);
          if(g){ g.name=name; g.target=target; g.walletId=walletId; g.manualAmount=manualAmount; g.direction=goalDraftDirection; g.monthlyTarget=monthlyTarget; }
        } else {
          const baseline = goalDraftDirection==='down'
            ? (walletId ? Math.abs(walletBalance(walletById(walletId))) : manualAmount)
            : 0;
          goals.push({id:uid(), name, direction:goalDraftDirection, target, walletId, manualAmount, baseline, monthlyTarget});
        }
        persist();
        showAddGoal = false;
        editingGoalId = null;
        render();
      });
    }

    document.querySelectorAll('[data-view-receipt]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        const tx = txs.find(t=>t.id===el.getAttribute('data-view-receipt'));
        if(tx && tx.receiptDataUrl){ receiptModal = tx.receiptDataUrl; render(); }
      });
    });
    const receiptOverlay = document.getElementById('receipt-modal-overlay');
    if(receiptOverlay){
      receiptOverlay.addEventListener('click', (e)=>{ if(e.target===receiptOverlay){ receiptModal=null; render(); }});
      document.getElementById('receipt-close').addEventListener('click', ()=>{ receiptModal=null; render(); });
    }

    document.querySelectorAll('[data-toggle-check]').forEach(pill=>{
      pill.addEventListener('click', ()=>{
        const tx = txs.find(t=>t.id===pill.getAttribute('data-toggle-check'));
        if(!tx) return;
        tx.checkCleared = !tx.checkCleared;
        persist();
        render();
      });
    });

    document.querySelectorAll('[data-log-installment]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const p = installmentPlans.find(x=>x.id===btn.getAttribute('data-log-installment'));
        if(!p || p.paidCount>=p.months) return;
        p.paidCount++;
        txs.push({id:uid(), walletId:p.walletId, type:'expense', amount:p.monthlyAmount, category:p.category, note:p.name+' ('+p.paidCount+'/'+p.months+')', date: todayStr(), reimbursable:false, reimbursed:false, loaned:false, repaid:false, installmentPlanId:p.id});
        persist();
        render();
      });
    });
    document.querySelectorAll('[data-del-plan]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if(!confirm('Remove this installment plan? Payments already logged stay in your ledger.')) return;
        installmentPlans = installmentPlans.filter(p=>p.id!==btn.getAttribute('data-del-plan'));
        persist();
        render();
      });
    });
  }

  function onAddTx(){
    const amount = parseFloat(document.getElementById('f-amount').value);
    const date = document.getElementById('f-date').value || todayStr();
    const note = document.getElementById('f-note').value.trim();
    if(!amount || amount<=0) return;

    let createdTx = null;

    if(txType==='transfer'){
      const fromId = document.getElementById('f-wallet').value;
      const toId = document.getElementById('f-wallet-to').value;
      if(!fromId || !toId || fromId===toId) return;
      const fromName = walletById(fromId)?.name || '';
      const toName = walletById(toId)?.name || '';
      const outId = uid(), inId = uid();
      txs.push({id:outId, walletId:fromId, type:'transfer_out', amount, category:'transfer', note, date, transferLabel:'To '+toName, linkedId:inId});
      txs.push({id:inId, walletId:toId, type:'transfer_in', amount, category:'transfer', note, date, transferLabel:'From '+fromName, linkedId:outId});
    } else {
      const walletId = document.getElementById('f-wallet').value;
      const categoryEl = document.getElementById('f-category');
      const category = categoryEl ? categoryEl.value : (txType==='income' ? 'salary' : 'misc');
      if(!walletId) return;
      const reimbursable = txType==='expense' ? reimbursableFlag : false;
      const loaned = txType==='expense' ? loanedFlag : false;
      let reimbursableAmount = null;
      if(reimbursable){
        const raw = document.getElementById('f-reimbursable-amount')?.value;
        const parsed = raw ? parseFloat(raw) : NaN;
        reimbursableAmount = (!isNaN(parsed) && parsed > 0) ? Math.min(parsed, amount) : amount;
      }
      const monthsEl = document.getElementById('f-installment-months');
      const isInstallment = txType==='expense' && installmentFlag && monthsEl;

      if(isInstallment){
        const months = parseInt(monthsEl.value, 10);
        const monthlyAmount = Math.round((amount/months)*100)/100;
        const planId = uid();
        const planName = note || catById(category).name;
        installmentPlans.push({id:planId, name:planName, walletId, category, totalAmount:amount, months, monthlyAmount, paidCount:1, startDate:date});
        createdTx = {id:uid(), walletId, type:'expense', amount:monthlyAmount, category, note:planName+' (1/'+months+')', date, reimbursable:false, reimbursed:false, loaned:false, repaid:false, installmentPlanId:planId};
      } else {
        createdTx = {id:uid(), walletId, type:txType, amount, category, note, date, reimbursable, reimbursableAmount, reimbursed:false, loaned, repaid:false};
      }
      if(txType==='expense' && formAllowanceChoice) createdTx.allowanceTxId = formAllowanceChoice;
      if(pendingReceipt){
        createdTx.receiptDataUrl = pendingReceipt.dataUrl;
        createdTx.receiptName = pendingReceipt.fileName;
      }
      const groupPrim = (txType==='income' && formAllowanceGroup) ? txs.find(t=>t.id===formAllowanceGroup) : null;
      if(txType==='income' && category==='family_support'){
        createdTx.allowanceAmount = amount;
        createdTx.allowanceCats = groupPrim ? (groupPrim.allowanceCats||[]).slice() : formAllowanceCats.slice();
        createdTx.allowanceSource = groupPrim ? (groupPrim.allowanceSource||'Family') : (formAllowanceSource.trim() || 'Family');
        if(groupPrim) createdTx.allowanceGroupId = groupPrim.id;
      } else if(txType==='income' && allowanceFlag && catById(category).trueIncome){
        const aAmt = parseFloat(formAllowanceAmount);
        if(!aAmt || aAmt<=0 || (!groupPrim && !formAllowanceCats.length)){ alert('For an allowance, enter its amount and pick at least one category it can be used for.'); return; }
        createdTx.allowanceAmount = Math.min(aAmt, amount);
        createdTx.allowanceCats = groupPrim ? (groupPrim.allowanceCats||[]).slice() : formAllowanceCats.slice();
        createdTx.allowanceSource = groupPrim ? (groupPrim.allowanceSource||'Family') : (formAllowanceSource.trim() || 'Family');
        if(groupPrim) createdTx.allowanceGroupId = groupPrim.id;
      }
      if(txType==='income' && category==='refund_in' && formRefundsTxId){
        createdTx.refundsTxId = formRefundsTxId;
        const target = txs.find(t=>t.id===formRefundsTxId);
        if(target && !createdTx.note) createdTx.note = 'Refund: ' + (target.note || catById(target.category).name);
      }
      if(txType==='income' && checkFlag){
        createdTx.isCheck = true;
        createdTx.checkNumber = document.getElementById('f-check-number')?.value.trim() || '';
        createdTx.checkBank = document.getElementById('f-check-bank')?.value.trim() || '';
        createdTx.checkCleared = false;
      }
      txs.push(createdTx);
    }
    reimbursableFlag = false;
    loanedFlag = false;
    installmentFlag = false;
    checkFlag = false;
    pendingReceipt = null;
    receiptOcrError = '';
    formAmount = '';
    formDate = '';
    formNote = '';
    formCategory = null;
    formCheckNumber = '';
    formCheckBank = '';
    formReimbursableAmount = '';
    formRefundsTxId = '';
    allowanceFlag = false; formAllowanceAmount = ''; formAllowanceCats = []; formAllowanceSource = 'Family'; formAllowanceChoice = ''; formAllowanceGroup = '';
    persist();
    render();
  }

  // ---------- accessibility & UX enhancements ----------
  function closeTopModal(){
    if(loanPayModal){ loanPayModal=null; return true; }
    if(loanModal){ loanModal=null; return true; }
    if(payModal){ payModal=null; return true; }
    if(receiptModal){ receiptModal=null; return true; }
    if(moneyBackModal){ moneyBackModal=null; return true; }
    if(editingTxId){ editingTxId=null; return true; }
    if(editingWalletId){ editingWalletId=null; return true; }
    if(editingBudgetId){ editingBudgetId=null; showAddBudget=false; return true; }
    if(editingGoalId){ editingGoalId=null; showAddGoal=false; return true; }
    if(contributingGoalId){ contributingGoalId=null; return true; }
    if(showAddWallet){ showAddWallet=false; return true; }
    if(showAddBudget){ showAddBudget=false; return true; }
    if(showAddGoal){ showAddGoal=false; return true; }
    if(showSyncModal){ showSyncModal=false; return true; }
    if(showAiModal){ showAiModal=false; return true; }
    if(aiResultModal){ aiResultModal=null; return true; }
    if(showStatementImport){ showStatementImport=false; return true; }
    return false;
  }
  let _enhanceTimer = null;
  let _lastFocusBeforeModal = null;
  function enhanceA11y(){
    root.querySelectorAll('.tag-pill[id], .clear-filter, .month-today, .receipt-link, .wcard, .wcard-add, [data-money-back], [data-toggle-check], .swatch').forEach(el=>{
      if(!el.hasAttribute('role')) el.setAttribute('role','button');
      if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    });
    root.querySelectorAll('.tx-edit').forEach(el=>{ if(!el.getAttribute('aria-label')) el.setAttribute('aria-label','Edit transaction'); });
    root.querySelectorAll('.tx-del').forEach(el=>{ if(!el.getAttribute('aria-label')) el.setAttribute('aria-label','Delete transaction'); });
    root.querySelectorAll('.budget-edit').forEach(el=>{ if(!el.getAttribute('aria-label')) el.setAttribute('aria-label','Edit budget'); });
    root.querySelectorAll('.budget-del').forEach(el=>{ if(!el.getAttribute('aria-label')) el.setAttribute('aria-label','Remove budget'); });
    root.querySelectorAll('.month-btn').forEach(el=>{ el.setAttribute('aria-label', el.dataset.monthShift==='-1' ? 'Previous month' : 'Next month'); });
    root.querySelectorAll('.month-select').forEach(el=>el.setAttribute('aria-label','Select month'));
    // associate labels with their controls
    root.querySelectorAll('.field').forEach(f=>{
      const lab = f.querySelector(':scope > label');
      const ctl = f.querySelector('input:not([type=checkbox]),select,textarea');
      if(lab && ctl && !lab.htmlFor){
        if(!ctl.id) ctl.id = 'ctl-' + Math.random().toString(36).slice(2,8);
        lab.htmlFor = ctl.id;
      }
    });
    root.querySelectorAll('.modal').forEach(m=>{
      m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
      const h = m.querySelector('h3'); if(h){ if(!h.id) h.id='dlg-'+Math.random().toString(36).slice(2,8); m.setAttribute('aria-labelledby',h.id); }
    });
    const modal = root.querySelector('.modal');
    if(modal && !modal.dataset.focused){
      modal.dataset.focused = '1';
      const first = modal.querySelector('input:not([type=hidden]):not([type=checkbox]),select,textarea,button');
      if(first && document.activeElement && !modal.contains(document.activeElement)){ _lastFocusBeforeModal = document.activeElement; first.focus({preventScroll:true}); }
    }
    root.querySelectorAll('.due-soon-banner,.empty-state').forEach(el=>el.setAttribute('role','status'));
  }
  new MutationObserver(()=>{ clearTimeout(_enhanceTimer); _enhanceTimer = setTimeout(enhanceA11y, 30); }).observe(root, {childList:true, subtree:true});
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape' && !isLocked){
      if(closeTopModal()){ e.preventDefault(); render(); if(_lastFocusBeforeModal && document.contains(_lastFocusBeforeModal)) _lastFocusBeforeModal.focus({preventScroll:true}); }
    }
    if((e.key==='Enter' || e.key===' ') && e.target && e.target.getAttribute && e.target.getAttribute('role')==='button' && !/^(BUTTON|INPUT|SELECT|TEXTAREA|A)$/.test(e.target.tagName)){
      e.preventDefault(); e.target.click();
    }
  });

  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden || !ghConfigured() || isLocked) return;
    if(Date.now() - lastPullAt < 20000) return;
    if(root.querySelector('.modal-overlay')) return;
    pullFromGitHub();
  });

  loadData();
})();
</script>
